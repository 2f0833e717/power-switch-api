[book]
title = "SwitchBot Power Switch API ドキュメント"
authors = ["SwitchBot Power Switch API Team"]
description = "SwitchBot APIを使用して電源を制御するWebアプリケーションのドキュメント"
language = "ja"
src = "."
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

# Windows環境とWSL環境の両方で動作するための設定
# Windowsでもプリプロセッサを使用する設定

# Windows環境用のmermaidプリプロセッサ設定
[preprocessor.mermaid]
command = "../scripts/mdbook/mdbook-mermaid.exe"

# WSL環境用のmermaidプリプロセッサ設定の場合は以下を使用
# [preprocessor.mermaid]
# command = "mdbook-mermaid"
